task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 42
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: E:/ISW_DETR_external_data/CCCM_full_20261024/
    ann_file: E:/ISW_DETR_external_data/CCCM_full_20261024/annotations/train.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomHorizontalFlip
        p: 0.5
      - type: Resize
        size:
        - 384
        - 384
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy: null
  shuffle: true
  num_workers: 0
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    scales: null
    stop_epoch: 71
  total_batch_size: 4
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: E:/ISW_DETR_external_data/CCCM_full_20261024/
    ann_file: E:/ISW_DETR_external_data/CCCM_full_20261024/annotations/dev.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 384
        - 384
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 0
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 8
print_freq: 100
output_dir: E:/ISW_DETR_external_data/CCCM_full_20261024/runs/base_seed42
checkpoint_freq: 1000
sync_bn: false
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
epoches: 20
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 16
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 100
model: RTDETR
criterion: RTDETRCriterionv2
postprocessor: RTDETRPostProcessor
use_focal_loss: true
eval_spatial_size:
- 384
- 384
RTDETR:
  backbone: PResNet
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2
PResNet:
  depth: 18
  variant: d
  freeze_at: -1
  return_idx:
  - 1
  - 2
  - 3
  num_stages: 4
  freeze_norm: false
  pretrained: false
HybridEncoder:
  in_channels:
  - 128
  - 256
  - 512
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 0.5
  depth_mult: 1
  act: silu
RTDETRTransformerv2:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  eval_idx: -1
  num_points:
  - 4
  - 4
  - 4
  cross_attn_method: default
  query_select_method: default
RTDETRPostProcessor:
  num_top_queries: 300
RTDETRCriterionv2:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
  losses:
  - vfl
  - boxes
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
device: cuda
early_stop:
  enabled: false
